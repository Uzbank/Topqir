name: Android (APK + AAB)

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: topqir
    env:
      VERSION_CODE: ${{ github.run_number }}
      HAS_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install
        run: npm install

      - name: Build web (fonts)
        run: npm run build

      - name: Create Android project
        run: |
          [ -d android ] || npx cap add android
          npx capacitor-assets generate --android --iconBackgroundColor '#1C1348' --splashBackgroundColor '#1C1348'
          node scripts/patch-native.mjs android
          npx cap sync android

      - name: Debug APK
        working-directory: topqir/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Release AAB + APK (signed)
        if: env.HAS_KEYSTORE == 'true'
        working-directory: topqir/android
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
          ./gradlew bundleRelease assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file="$RUNNER_TEMP/release.jks" \
            -Pandroid.injected.signing.store.password="$KS_PASS" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASS"

      - uses: actions/upload-artifact@v4
        with:
          name: topqir-android-${{ github.run_number }}
          path: |
            topqir/android/app/build/outputs/apk/**/*.apk
            topqir/android/app/build/outputs/bundle/**/*.aab
          if-no-files-found: error
