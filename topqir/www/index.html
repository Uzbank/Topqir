<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#1C1348">
<title>Топқир</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
:root{
  --night:#1C1348; --night-2:#271C63; --night-3:#33267A;
  --magenta:#E2266F; --saffron:#FFB81C; --emerald:#12A47A; --sky:#2FB4E0;
  --snow:#FBF8FF; --muted:#B9B0E6; --line:rgba(251,248,255,.14);
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --safe-t:env(safe-area-inset-top,0px); --safe-b:env(safe-area-inset-bottom,0px);
  --safe-l:env(safe-area-inset-left,0px); --safe-r:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--night);color:var(--snow);font-family:var(--body);font-size:16px;line-height:1.45;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
input,textarea{font:inherit;color:var(--snow);-webkit-user-select:text;user-select:text}
:focus-visible{outline:3px solid var(--saffron);outline-offset:3px;border-radius:12px}
.screen{display:none;min-height:100%;}
.screen.on{display:block}
.wrap{max-width:560px;margin:0 auto;padding:calc(16px + var(--safe-t)) calc(16px + var(--safe-r)) calc(120px + var(--safe-b)) calc(16px + var(--safe-l))}

/* atlas band */
.atlas{height:112px;margin:calc(-16px - var(--safe-t)) -16px 0;background-size:60px 90px;background-repeat:repeat;position:relative}
.atlas::after{content:"";position:absolute;inset:auto 0 0 0;height:56px;background:linear-gradient(to bottom,transparent,var(--night))}

/* home */
.brand{margin:-28px 0 4px;position:relative;z-index:1}
.brand h1{font-family:var(--display);font-weight:800;font-size:clamp(44px,13vw,64px);line-height:1;letter-spacing:-.02em;margin:0}
.brand p{margin:8px 0 0;color:var(--muted);font-size:17px}
.topbar{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:20px 0 26px}
.seg{display:inline-flex;background:var(--night-2);border-radius:14px;padding:4px;gap:2px}
.seg button{padding:8px 12px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--snow);color:var(--night)}
.iconbtn{width:42px;height:42px;border-radius:14px;background:var(--night-2);display:grid;place-items:center;font-size:20px;flex:none}
h2{font-family:var(--display);font-weight:700;font-size:20px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);margin:0 0 16px;font-size:15px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.deck{position:relative;text-align:left;padding:0;border-radius:20px;overflow:hidden;background:var(--night-2);min-height:148px;display:flex;flex-direction:column;transition:transform .12s}
.deck:active{transform:scale(.97)}
.deck .strip{height:44px;background-size:40px 60px}
.deck .body{padding:10px 14px 14px;display:flex;flex-direction:column;gap:2px;flex:1}
.deck .emo{font-size:28px;line-height:1;margin-top:-26px;width:48px;height:48px;border-radius:16px;display:grid;place-items:center;background:var(--night-2);box-shadow:0 0 0 4px var(--night-2)}
.deck .nm{font-weight:800;font-size:16px;line-height:1.2;margin-top:6px}
.deck .ct{color:var(--muted);font-size:13px}
.deck .tick{position:absolute;top:10px;right:10px;width:28px;height:28px;border-radius:50%;background:rgba(28,19,72,.55);border:2px solid rgba(251,248,255,.7);display:grid;place-items:center;font-size:15px;font-weight:900}
.deck[aria-pressed=false] .tick{color:transparent}
.deck[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--snow)}
.deck[aria-pressed=true] .tick{background:var(--snow);color:var(--night);border-color:var(--snow)}
.deck .edit{position:absolute;bottom:10px;right:10px;width:32px;height:32px;border-radius:10px;background:var(--night-3);display:grid;place-items:center;font-size:14px}
.deck.add{border:2px dashed var(--line);background:transparent;align-items:center;justify-content:center;text-align:center;gap:6px;padding:16px;color:var(--muted);font-weight:700}
.deck.add b{font-size:34px;line-height:1;color:var(--snow);font-weight:400}
.dock{position:fixed;left:0;right:0;bottom:0;padding:14px calc(16px + var(--safe-r)) calc(14px + var(--safe-b)) calc(16px + var(--safe-l));background:linear-gradient(to top,var(--night) 65%,transparent);z-index:5}
.dock>div{max-width:528px;margin:0 auto;display:flex;gap:10px}
.btn{flex:1;min-height:58px;border-radius:18px;font-weight:800;font-size:18px;padding:0 20px;display:flex;align-items:center;justify-content:center;gap:10px}
.btn.primary{background:var(--saffron);color:var(--night)}
.btn.primary:disabled{background:var(--night-3);color:var(--muted)}
.btn.ghost{background:var(--night-2);color:var(--snow);flex:0 0 auto}
.btn.danger{background:transparent;color:#FF7A9C;flex:0 0 auto}

/* setup */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:700;padding:8px 0;margin-bottom:8px}
.field{margin:0 0 26px}
.field>label,.field>.lbl{display:block;font-weight:800;margin-bottom:10px;font-size:16px}
.seg.full{display:flex}
.seg.full button{flex:1;padding:12px 6px;font-size:15px}
.mode-note{color:var(--muted);font-size:14px;margin:8px 2px 0}
.team{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.team .dot{width:14px;height:14px;border-radius:50%;flex:none}
.team input{flex:1;min-width:0;background:var(--night-2);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-weight:700}
.team input:focus{border-color:var(--sky);outline:none}
.team button{width:44px;height:44px;border-radius:12px;background:var(--night-2);color:var(--muted);font-size:20px}
.addteam{color:var(--sky);font-weight:800;padding:10px 2px}
.stepper{display:inline-flex;align-items:center;background:var(--night-2);border-radius:14px}
.stepper button{width:52px;height:48px;font-size:24px;font-weight:700}
.stepper span{min-width:40px;text-align:center;font-weight:800;font-size:20px}
.summary{background:var(--night-2);border-radius:16px;padding:14px 16px;color:var(--muted);font-size:15px}
.summary b{color:var(--snow)}

/* turn */
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(24px + var(--safe-t)) 24px calc(24px + var(--safe-b))}
.turn-kicker{color:var(--muted);font-size:17px;margin:0}
.turn-team{font-family:var(--display);font-weight:800;font-size:clamp(36px,10vw,60px);line-height:1.05;margin:8px 0 18px;letter-spacing:-.02em}
.turn-meta{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-bottom:26px}
.chip{background:var(--night-2);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.howto{max-width:420px;display:grid;gap:10px;margin:0 auto 30px;text-align:left}
.howto div{display:flex;gap:12px;align-items:center;background:var(--night-2);border-radius:16px;padding:12px 14px;font-size:15px}
.howto i{font-style:normal;font-size:24px;width:32px;text-align:center;flex:none}
.center .btn{flex:none;width:100%;max-width:420px}
.center .linkbtn{margin-top:14px;color:var(--muted);font-weight:700;padding:10px}

/* play */
#play{position:fixed;inset:0;overflow:hidden;background:var(--deck,var(--magenta));touch-action:none}
#play.on{display:block}
#play .edge{position:absolute;top:0;bottom:0;width:calc(48px + var(--safe-l));background-size:40px 60px;opacity:.9}
#play .edge.l{left:0}
#play .edge.r{right:0;width:calc(48px + var(--safe-r))}
#play .hud{position:absolute;top:calc(10px + var(--safe-t));left:calc(64px + var(--safe-l));right:calc(64px + var(--safe-r));display:flex;justify-content:space-between;align-items:center;z-index:2}
#timer{font-family:var(--display);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;min-width:90px}
#timer.low{color:var(--snow);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.45}}
#scoreLive{font-weight:800;font-size:18px;background:rgba(28,19,72,.3);border-radius:999px;padding:6px 14px}
#quit{width:44px;height:44px;border-radius:14px;background:rgba(28,19,72,.3);font-size:20px;font-weight:800}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px calc(72px + var(--safe-r)) 56px calc(72px + var(--safe-l));text-align:center}
#modeBadge{font-weight:800;font-size:17px;background:rgba(28,19,72,.28);border-radius:999px;padding:6px 16px;margin-bottom:14px;min-height:1em}
#word{font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere;hyphens:auto;max-width:100%}
#deckLbl{margin-top:14px;font-weight:700;opacity:.8}
#play.dark{color:var(--night)}
#play.dark #modeBadge,#play.dark #scoreLive,#play.dark #quit{background:rgba(28,19,72,.12)}
.taps{position:absolute;bottom:calc(10px + var(--safe-b));left:calc(64px + var(--safe-l));right:calc(64px + var(--safe-r));display:flex;justify-content:space-between;font-weight:700;font-size:14px;opacity:.75;pointer-events:none}
#flash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:4;text-align:center;padding:24px}
#flash.on{display:flex;animation:pop .22s ease-out}
#flash.ok{background:var(--emerald);color:var(--snow)}
#flash.skip{background:var(--saffron);color:var(--night)}
#flash.end{background:var(--night);color:var(--snow)}
#flash .big{font-family:var(--display);font-weight:800;font-size:clamp(40px,10vw,84px);line-height:1}
#flash .small{font-size:20px;font-weight:700;margin-top:12px;opacity:.85}
@keyframes pop{from{transform:scale(1.06);opacity:.6}to{transform:none;opacity:1}}
#countdown{position:absolute;inset:0;background:var(--night);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center;padding:24px;color:var(--snow)}
#countdown.on{display:flex}
#countdown .n{font-family:var(--display);font-weight:800;font-size:120px;line-height:1}
#countdown p{font-size:20px;font-weight:700;margin:16px 0 0;max-width:520px}
#rotate{position:absolute;inset:0;background:var(--night);color:var(--snow);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:6;text-align:center;padding:32px;gap:18px}
#rotate.on{display:flex}
#rotate .ph{font-size:64px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
#rotate h3{font-family:var(--display);font-size:24px;margin:0}

/* results */
.res-head{text-align:center;margin:12px 0 22px}
.res-head .num{font-family:var(--display);font-weight:800;font-size:84px;line-height:1}
.res-head p{margin:6px 0 0;color:var(--muted)}
.res-list{display:grid;gap:8px}
.res-item{display:flex;align-items:center;gap:12px;background:var(--night-2);border-radius:14px;padding:12px 14px;text-align:left;font-weight:700;font-size:17px;width:100%}
.res-item .mk{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;font-weight:900}
.res-item.ok .mk{background:var(--emerald)}
.res-item.no{color:var(--muted)}
.res-item.no .mk{background:var(--night-3);color:var(--muted)}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:0 0 14px}

/* score */
.board{display:grid;gap:10px;margin:20px 0}
.row{display:flex;align-items:center;gap:14px;background:var(--night-2);border-radius:18px;padding:14px 16px}
.row .pl{font-family:var(--display);font-weight:800;font-size:18px;width:28px;color:var(--muted)}
.row .tn{flex:1;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px;min-width:0}
.row .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .pts{font-family:var(--display);font-weight:800;font-size:28px}
.row.lead{box-shadow:inset 0 0 0 3px var(--saffron)}
.winner{font-family:var(--display);font-weight:800;font-size:clamp(32px,9vw,52px);line-height:1.08;text-align:center;margin:8px 0 0;letter-spacing:-.02em}

/* editor & rules */
.ed-emojis{display:flex;flex-wrap:wrap;gap:8px}
.ed-emojis button{width:48px;height:48px;border-radius:14px;background:var(--night-2);font-size:24px}
.ed-emojis button[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--snow)}
.txt{width:100%;background:var(--night-2);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-weight:600}
.txt:focus{border-color:var(--sky);outline:none}
textarea.txt{min-height:220px;resize:vertical;line-height:1.5}
.err{color:#FF7A9C;font-weight:700;margin:-14px 0 20px;font-size:14px;min-height:1px}
.rules p{margin:0 0 14px;font-size:16px}
.rules ol{padding-left:22px;margin:0 0 18px}
.rules li{margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:calc(96px + var(--safe-b));transform:translateX(-50%);width:max-content;max-width:calc(100vw - 48px);text-align:center;border-radius:18px!important;background:var(--snow);color:var(--night);font-weight:800;padding:10px 18px;border-radius:999px;z-index:20;display:none}
.toast.on{display:block}
#modal{position:fixed;inset:0;background:rgba(10,6,30,.72);display:none;align-items:center;justify-content:center;z-index:50;padding:24px}
#modal.on{display:flex}
#modal .box{background:var(--night-2);border-radius:22px;padding:22px;max-width:380px;width:100%}
#modal p{margin:0 0 18px;font-size:18px;font-weight:700}
#modal .acts{display:flex;gap:10px}
#modal .btn{flex:1;min-height:52px;font-size:17px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="wrap">
    <div class="atlas" id="heroAtlas" aria-hidden="true"></div>
    <div class="brand">
      <h1>Топқир</h1>
      <p data-t="tagline"></p>
    </div>
    <div class="topbar">
      <div class="seg" role="group" aria-label="Language" id="langSeg">
        <button data-lang="uz">Ўзбекча</button>
        <button data-lang="uzl">O‘zbekcha</button>
        <button data-lang="ru">Русский</button>
      </div>
      <button class="iconbtn" id="rulesBtn" aria-label="?">?</button>
    </div>
    <h2 data-t="chooseDecks"></h2>
    <p class="sub" data-t="chooseDecksSub"></p>
    <div class="grid" id="deckGrid"></div>
  </div>
  <div class="dock"><div>
    <button class="btn ghost" id="soundBtn" aria-label="Sound">🔊</button>
    <button class="btn primary" id="toSetup"></button>
  </div></div>
</section>

<!-- SETUP -->
<section id="setup" class="screen">
  <div class="wrap">
    <button class="back" data-go="home">‹ <span data-t="back"></span></button>
    <h2 data-t="setupTitle" style="font-size:26px;margin-bottom:22px"></h2>
    <div class="field">
      <span class="lbl" data-t="time"></span>
      <div class="seg full" id="timeSeg">
        <button data-v="30">30 с</button><button data-v="60">60 с</button><button data-v="90">90 с</button><button data-v="120">2 мин</button>
      </div>
    </div>
    <div class="field">
      <span class="lbl" data-t="mode"></span>
      <div class="seg full" id="modeSeg">
        <button data-v="explain" data-t="mExplain"></button><button data-v="show" data-t="mShow"></button><button data-v="mix" data-t="mMix"></button>
      </div>
      <p class="mode-note" id="modeNote"></p>
    </div>
    <div class="field">
      <span class="lbl" data-t="teams"></span>
      <div id="teamList"></div>
      <button class="addteam" id="addTeam">+ <span data-t="addTeam"></span></button>
    </div>
    <div class="field">
      <span class="lbl" data-t="rounds"></span>
      <div class="stepper"><button id="rMinus" aria-label="−">−</button><span id="rVal">3</span><button id="rPlus" aria-label="+">+</button></div>
    </div>
    <div class="summary" id="setupSummary"></div>
  </div>
  <div class="dock"><div><button class="btn primary" id="startGame" data-t="startGame"></button></div></div>
</section>

<!-- TURN -->
<section id="turn" class="screen">
  <div class="center">
    <p class="turn-kicker" id="turnKicker"></p>
    <div class="turn-team" id="turnTeam"></div>
    <div class="turn-meta" id="turnMeta"></div>
    <div class="howto">
      <div><i>📱</i><span data-t="how1"></span></div>
      <div><i>👇</i><span data-t="how2"></span></div>
      <div><i>👆</i><span data-t="how3"></span></div>
    </div>
    <button class="btn primary" id="ready" data-t="ready"></button>
    <button class="linkbtn" id="turnHome" data-t="endGame"></button>
  </div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
  <div class="edge l" id="edgeL" aria-hidden="true"></div>
  <div class="edge r" id="edgeR" aria-hidden="true"></div>
  <div class="hud"><div id="timer">60</div><div id="scoreLive">0</div><button id="quit" aria-label="×">×</button></div>
  <div id="stage">
    <div id="modeBadge"></div>
    <h1 id="word"></h1>
    <div id="deckLbl"></div>
  </div>
  <div class="taps"><span data-t="tapSkip"></span><span data-t="tapOk"></span></div>
  <div id="flash"><div class="big"></div><div class="small"></div></div>
  <div id="countdown"><div class="n">3</div><p data-t="putOnForehead"></p></div>
  <div id="rotate"><div class="ph">📱</div><h3 data-t="rotate"></h3><button class="btn ghost" id="rotateSkip" data-t="rotateSkip"></button></div>
</section>

<!-- RESULTS -->
<section id="results" class="screen">
  <div class="wrap">
    <div class="res-head"><div class="num" id="resNum">0</div><p id="resTxt"></p></div>
    <p class="hint" data-t="fixHint"></p>
    <div class="res-list" id="resList"></div>
  </div>
  <div class="dock"><div><button class="btn primary" id="resNext" data-t="continue"></button></div></div>
</section>

<!-- SCORE -->
<section id="score" class="screen">
  <div class="wrap">
    <h2 id="scoreTitle" style="font-size:26px;text-align:center;margin-top:8px"></h2>
    <p class="sub" id="scoreSub" style="text-align:center"></p>
    <div class="board" id="board"></div>
  </div>
  <div class="dock"><div>
    <button class="btn ghost" id="scoreHome" data-t="home"></button>
    <button class="btn primary" id="scoreNext"></button>
  </div></div>
</section>

<!-- EDITOR -->
<section id="editor" class="screen">
  <div class="wrap">
    <button class="back" data-go="home">‹ <span data-t="back"></span></button>
    <h2 id="edTitle" style="font-size:26px;margin-bottom:22px"></h2>
    <div class="field"><label for="edName" data-t="deckName"></label><input class="txt" id="edName" maxlength="40"></div>
    <div class="field"><span class="lbl" data-t="deckIcon"></span><div class="ed-emojis" id="edEmojis"></div></div>
    <div class="field"><label for="edWords" data-t="deckWords"></label><textarea class="txt" id="edWords"></textarea></div>
    <p class="err" id="edErr"></p>
  </div>
  <div class="dock"><div>
    <button class="btn danger" id="edDelete" data-t="delete"></button>
    <button class="btn primary" id="edSave" data-t="save"></button>
  </div></div>
</section>

<!-- RULES -->
<section id="rules" class="screen">
  <div class="wrap rules">
    <button class="back" data-go="home">‹ <span data-t="back"></span></button>
    <h2 data-t="rulesTitle" style="font-size:26px;margin-bottom:18px"></h2>
    <div id="rulesBody"></div>
  </div>
</section>

<div class="toast" id="toast"></div>
<div id="modal" role="dialog" aria-modal="true"><div class="box"><p></p><div class="acts"><button class="btn ghost" data-no></button><button class="btn primary" data-yes></button></div></div></div>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
