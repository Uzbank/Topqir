<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#0D0A1C">
<title>Топқир</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: phone-first single column; chunky "sticker" cards on deep night; atlas (ikat) texture as the brand motif */
:root{
  --bg:#0D0A1C; --bg-2:#17112E; --bg-3:#221A44; --line:rgba(255,255,255,.09);
  --text:#FFFFFF; --muted:#A9A3C9; --dim:#6F6896;
  --sun:#FFC83D; --sun-deep:#D99200; --pink:#FF3D7F; --mint:#2EE6A6; --mint-deep:#0FA676; --orange:#FF8A3D;
  --display:"Unbounded","Manrope",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --st:env(safe-area-inset-top,0px); --sb:env(safe-area-inset-bottom,0px);
  --sl:env(safe-area-inset-left,0px); --sr:env(safe-area-inset-right,0px);
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--body);font-size:16px;line-height:1.45;overscroll-behavior:none}
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,textarea{font:inherit;color:var(--text);-webkit-user-select:text;user-select:text}
:focus-visible{outline:3px solid var(--sun);outline-offset:3px;border-radius:14px}
.screen{display:none;min-height:100%}
.screen.on{display:block}
.wrap{max-width:600px;margin:0 auto;padding:calc(14px + var(--st)) max(16px,calc(16px + var(--sr))) calc(130px + var(--sb)) max(16px,calc(16px + var(--sl)))}

/* chunky buttons */
.btn{display:flex;align-items:center;justify-content:center;gap:10px;min-height:60px;padding:0 22px;border-radius:20px;font-weight:800;font-size:18px;transition:transform .08s,box-shadow .08s;flex:1}
.btn.sun{background:var(--sun);color:#1B1300;box-shadow:0 6px 0 var(--sun-deep)}
.btn.mint{background:var(--mint);color:#00261A;box-shadow:0 6px 0 var(--mint-deep)}
.btn.white{background:#fff;color:#1B1235;box-shadow:0 5px 0 rgba(0,0,0,.25)}
.btn.ghost{background:var(--bg-3);color:var(--text);box-shadow:0 5px 0 #0A0718;flex:0 0 auto}
.btn.danger{background:transparent;color:#FF7A9C;flex:0 0 auto;box-shadow:none}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 transparent}
.btn:disabled{background:var(--bg-3);color:var(--dim);box-shadow:0 6px 0 #0A0718}
.icon-btn{width:46px;height:46px;border-radius:16px;background:var(--bg-2);display:grid;place-items:center;font-size:19px;flex:none;border:1px solid var(--line)}
.pill{height:46px;border-radius:16px;background:var(--bg-2);border:1px solid var(--line);display:inline-flex;align-items:center;gap:8px;padding:0 14px;font-weight:800;font-size:15px}

/* header */
.head{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brand .mark{width:40px;height:40px;border-radius:13px;background-size:cover;flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:26px;letter-spacing:-.02em}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:22px 20px 20px;background:linear-gradient(135deg,#FF3D7F 0%,#FF6A3D 55%,#FFB03D 100%);box-shadow:0 8px 0 #A31D4C;margin-bottom:12px;min-height:212px;isolation:isolate}
.hero::before{content:"";position:absolute;inset:0;background-image:var(--ikat);background-size:44px 66px;opacity:.16;z-index:-1;mask-image:linear-gradient(100deg,transparent 35%,#000 80%);-webkit-mask-image:linear-gradient(100deg,transparent 35%,#000 80%)}
.hero h1{font-family:var(--display);font-weight:800;font-size:30px;line-height:1.05;margin:0 0 6px;letter-spacing:-.02em;max-width:60%}
.hero p{margin:0 0 18px;font-weight:600;font-size:15px;max-width:58%;opacity:.95}
.hero .btn{display:inline-flex;flex:none;min-height:52px;font-size:17px;padding:0 20px}
.fan{position:absolute;right:-22px;top:30px;width:40%;height:160px;pointer-events:none}
.hero h1,.hero p,.hero .btn{position:relative;z-index:1}
.fan span{position:absolute;right:18px;top:10px;width:98px;height:128px;border-radius:18px;background:#fff;color:#1B1235;display:flex;align-items:center;justify-content:center;text-align:center;padding:10px;font-family:var(--display);font-weight:800;font-size:13px;line-height:1.1;box-shadow:0 10px 24px rgba(60,0,30,.3);transform-origin:50% 120%;overflow-wrap:anywhere}
.fan span:nth-child(1){transform:rotate(-16deg) translateX(-26px);background:#FFE7F0}
.fan span:nth-child(2){transform:rotate(-4deg) translateX(-10px);background:#FFF3DA}
.fan span:nth-child(3){transform:rotate(9deg) translateX(10px)}
.hero.anim .fan span{animation:deal .7s cubic-bezier(.2,.9,.3,1.3) backwards}
.hero.anim .fan span:nth-child(2){animation-delay:.08s}.hero.anim .fan span:nth-child(3){animation-delay:.16s}
@keyframes deal{from{transform:translate(60px,40px) rotate(30deg);opacity:0}}
.stats{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 26px}
.stats span{background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:7px 13px;font-weight:700;font-size:13px;color:var(--muted)}
.stats b{color:var(--text)}

/* sections & decks */
.sec{margin-bottom:28px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:12px}
.sec-h h2{font-family:var(--display);font-weight:700;font-size:19px;margin:0;letter-spacing:-.01em;text-wrap:balance}
.sec-h button{color:var(--muted);font-weight:800;font-size:14px;padding:6px 2px;white-space:nowrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (min-width:560px){.grid{grid-template-columns:1fr 1fr 1fr}}
.deck{position:relative;overflow:hidden;border-radius:22px;min-height:136px;padding:14px;text-align:left;display:flex;flex-direction:column;justify-content:space-between;background:linear-gradient(145deg,var(--c1),var(--c2));color:#fff;box-shadow:0 5px 0 rgba(0,0,0,.35);transition:transform .1s;isolation:isolate}
.deck::before{content:"";position:absolute;inset:0;background-image:var(--pat);background-size:30px 45px;opacity:.15;z-index:-1;mask-image:linear-gradient(200deg,#000 10%,transparent 60%);-webkit-mask-image:linear-gradient(200deg,#000 10%,transparent 60%)}
.deck.dark{color:#22160A}
.deck:active{transform:scale(.97)}
.deck .emo{font-size:38px;line-height:1;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.deck .nm{font-weight:800;font-size:16px;line-height:1.18;text-wrap:balance}
.deck .ct{font-weight:700;font-size:13px;opacity:.8;margin-top:2px}
.deck .new{position:absolute;top:12px;right:12px;background:rgba(255,255,255,.95);color:#C0134F;font-weight:800;font-size:11px;border-radius:999px;padding:3px 9px}
.deck .chk{position:absolute;top:10px;right:10px;width:30px;height:30px;border-radius:50%;background:#fff;color:#1B1235;display:none;place-items:center;font-weight:900;font-size:16px;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.deck[aria-pressed=true]{box-shadow:0 0 0 3px var(--bg),0 0 0 6px #fff,0 5px 0 rgba(0,0,0,.35)}
.deck[aria-pressed=true] .chk{display:grid}
.deck[aria-pressed=true] .new{display:none}
.deck .edit{position:absolute;bottom:10px;right:10px;width:34px;height:34px;border-radius:11px;background:rgba(0,0,0,.25);display:grid;place-items:center;font-size:15px}
.deck.add{background:transparent;border:2px dashed rgba(255,255,255,.18);box-shadow:none;align-items:center;justify-content:center;text-align:center;gap:6px;color:var(--muted);font-weight:800}
.deck.add::before{display:none}
.deck.add b{font-size:34px;color:#fff;font-weight:400;line-height:1}

.dock{position:fixed;left:0;right:0;bottom:0;padding:16px max(16px,calc(16px + var(--sr))) calc(16px + var(--sb)) max(16px,calc(16px + var(--sl)));background:linear-gradient(to top,var(--bg) 62%,transparent);z-index:5}
.dock>div{max-width:568px;margin:0 auto;display:flex;gap:10px}

/* setup */
.back{display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-weight:800;padding:10px 0;margin-bottom:6px}
.title{font-family:var(--display);font-weight:800;font-size:28px;line-height:1.1;letter-spacing:-.02em;margin:0 0 22px}
.card{background:var(--bg-2);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
.card>.lbl{display:block;font-weight:800;margin-bottom:12px}
.seg{display:flex;gap:6px;background:var(--bg);border-radius:16px;padding:5px}
.seg button{flex:1;padding:12px 4px;border-radius:12px;font-weight:800;font-size:15px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:#fff;color:#1B1235;box-shadow:0 3px 0 rgba(0,0,0,.3)}
.note{color:var(--muted);font-size:14px;margin:10px 2px 0}
.team{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.team .dot{width:16px;height:16px;border-radius:6px;flex:none}
.team input{flex:1;min-width:0;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-weight:700}
.team input:focus{border-color:var(--sun);outline:none}
.team button{width:46px;height:46px;border-radius:14px;background:var(--bg);color:var(--muted);font-size:20px}
.addteam{color:var(--sun);font-weight:800;padding:10px 2px}
.stepper{display:inline-flex;align-items:center;background:var(--bg);border-radius:16px}
.stepper button{width:54px;height:50px;font-size:24px;font-weight:700}
.stepper span{min-width:44px;text-align:center;font-family:var(--display);font-weight:800;font-size:20px}
.summary{color:var(--muted);font-size:15px;padding:4px 4px 0}
.summary b{color:var(--text)}

/* turn */
.center{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:calc(24px + var(--st)) 24px calc(24px + var(--sb));position:relative;overflow:hidden}
.blob{position:absolute;width:420px;height:420px;border-radius:50%;filter:blur(80px);opacity:.35;top:-120px;left:50%;transform:translateX(-50%);pointer-events:none}
.kicker{color:var(--muted);font-weight:700;font-size:16px;margin:0}
.big-team{font-family:var(--display);font-weight:800;font-size:clamp(38px,11vw,64px);line-height:1.04;margin:6px 0 16px;letter-spacing:-.02em;text-wrap:balance;position:relative}
.chips{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:26px;position:relative}
.chip{background:var(--bg-2);border:1px solid var(--line);border-radius:999px;padding:8px 14px;font-weight:700;font-size:14px}
.howto{max-width:420px;width:100%;display:grid;gap:10px;margin:0 auto 30px;text-align:left;position:relative}
.howto div{display:flex;gap:12px;align-items:center;background:var(--bg-2);border:1px solid var(--line);border-radius:18px;padding:12px 14px;font-size:15px;font-weight:600}
.howto i{font-style:normal;font-size:24px;width:34px;text-align:center;flex:none}
.center .btn{flex:none;width:100%;max-width:420px}
.linkbtn{margin-top:16px;color:var(--muted);font-weight:800;padding:10px}

/* play */
#play{position:fixed;inset:0;overflow:hidden;background:linear-gradient(135deg,var(--c1,#FF3D7F),var(--c2,#FF8A3D));touch-action:none;color:#fff;isolation:isolate}
#play.on{display:block}
#play::before{content:"";position:absolute;inset:0;background-image:var(--pat);background-size:44px 66px;opacity:.13;z-index:-1}
#play.dark{color:#22160A}
.hud{position:absolute;top:calc(12px + var(--st));left:calc(18px + var(--sl));right:calc(18px + var(--sr));display:flex;justify-content:space-between;align-items:center;z-index:2}
.ring{position:relative;width:64px;height:64px}
.ring svg{position:absolute;inset:0;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:6}
.ring .bgc{stroke:rgba(0,0,0,.18)}
.ring .fg{stroke:currentColor;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
.ring.low{animation:pulse .5s ease-in-out infinite alternate}
@keyframes pulse{to{transform:scale(1.1)}}
.glass{background:rgba(0,0,0,.2);border-radius:999px;padding:8px 16px;font-weight:800;font-size:17px;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
#play.dark .glass{background:rgba(255,255,255,.35)}
#quit{width:48px;height:48px;border-radius:16px;font-size:22px;padding:0}
#stage{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:82px calc(48px + var(--sr)) 54px calc(48px + var(--sl));text-align:center}
#badge{margin-bottom:14px}
#word{font-family:var(--display);font-weight:800;line-height:1.02;letter-spacing:-.02em;margin:0;overflow-wrap:anywhere;hyphens:auto;max-width:100%;text-shadow:0 4px 0 rgba(0,0,0,.12)}
#ans{margin-top:14px;font-weight:800;font-size:clamp(18px,3.6vw,28px);opacity:.92;max-width:90%;display:none}
#ans.on{display:block}
#deckLbl{margin-top:14px;font-weight:700;opacity:.8}
#word.in{animation:wIn .28s cubic-bezier(.2,.9,.3,1.2)}
@keyframes wIn{from{transform:scale(.85);opacity:0}}
.taps{position:absolute;bottom:calc(12px + var(--sb));left:calc(22px + var(--sl));right:calc(22px + var(--sr));display:flex;justify-content:space-between;font-weight:800;font-size:14px;opacity:.7;pointer-events:none}
#flash{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;z-index:4;text-align:center;padding:24px;gap:10px}
#flash.on{display:flex}
#flash.ok{background:var(--mint);color:#00261A}
#flash.skip{background:var(--sun);color:#1B1300}
#flash.end{background:var(--bg);color:#fff}
#flash .ic{width:96px;height:96px;border-radius:50%;background:rgba(255,255,255,.35);display:grid;place-items:center;font-size:52px;font-weight:900;animation:pop .35s cubic-bezier(.2,.9,.3,1.5)}
#flash .big{font-family:var(--display);font-weight:800;font-size:clamp(34px,8vw,72px);line-height:1}
#flash .small{font-size:20px;font-weight:800;opacity:.85;max-width:90%}
@keyframes pop{from{transform:scale(.3)}}
#countdown{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:5;text-align:center;padding:24px;color:#fff}
#countdown.on{display:flex}
#countdown .n{font-family:var(--display);font-weight:800;font-size:130px;line-height:1;background:linear-gradient(135deg,var(--sun),var(--pink));-webkit-background-clip:text;background-clip:text;color:transparent}
#countdown .n.tick{animation:pop .4s cubic-bezier(.2,.9,.3,1.4)}
#countdown p{font-size:20px;font-weight:800;margin:16px 0 0}
#rotate{position:absolute;inset:0;background:var(--bg);color:#fff;display:none;flex-direction:column;align-items:center;justify-content:center;z-index:6;text-align:center;padding:32px;gap:18px}
#rotate.on{display:flex}
#rotate .ph{font-size:64px;animation:rot 2s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(90deg)}}
#rotate h3{font-family:var(--display);font-size:22px;margin:0}

/* results & score */
.res-head{text-align:center;margin:10px 0 18px}
.res-num{display:inline-grid;place-items:center;width:150px;height:150px;border-radius:50%;background:conic-gradient(var(--mint) var(--p,0%),var(--bg-3) 0);position:relative}
.res-num::after{content:"";position:absolute;inset:12px;border-radius:50%;background:var(--bg)}
.res-num b{position:relative;z-index:1;font-family:var(--display);font-weight:800;font-size:58px}
.res-head p{margin:12px 0 0;color:var(--muted);font-weight:700}
.hint{color:var(--muted);font-size:14px;text-align:center;margin:0 0 14px}
.res-list{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.res-item{display:inline-flex;align-items:center;gap:8px;border-radius:999px;padding:10px 14px;font-weight:800;font-size:15px;background:var(--bg-2);border:1px solid var(--line);max-width:100%;text-align:left}
.res-item .mk{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;flex:none;font-size:12px;font-weight:900}
.res-item.ok{background:rgba(46,230,166,.14);border-color:rgba(46,230,166,.4)}
.res-item.ok .mk{background:var(--mint);color:#00261A}
.res-item.no{color:var(--muted);text-decoration:line-through;text-decoration-thickness:2px}
.res-item.no .mk{background:var(--bg-3)}
.board{display:grid;gap:10px;margin:18px 0}
.row{display:flex;align-items:center;gap:14px;background:var(--bg-2);border:1px solid var(--line);border-radius:20px;padding:14px 16px}
.row .pl{font-family:var(--display);font-weight:800;font-size:18px;width:30px;color:var(--muted)}
.row .tn{flex:1;font-weight:800;font-size:18px;display:flex;align-items:center;gap:10px;min-width:0}
.row .tn span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .tn i{width:14px;height:14px;border-radius:5px;flex:none}
.row .pts{font-family:var(--display);font-weight:800;font-size:28px}
.row.lead{background:linear-gradient(135deg,rgba(255,200,61,.2),rgba(255,61,127,.15));border-color:rgba(255,200,61,.55)}
.winner{text-align:center;margin:6px 0 4px}
.winner .cup{font-size:64px;line-height:1}
.winner h3{font-family:var(--display);font-weight:800;font-size:clamp(28px,8vw,44px);line-height:1.08;margin:8px 0 0;letter-spacing:-.02em;text-wrap:balance}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:30}

/* editor, rules, sheets */
.ed-emojis{display:flex;flex-wrap:wrap;gap:8px}
.ed-emojis button{width:50px;height:50px;border-radius:15px;background:var(--bg);font-size:24px}
.ed-emojis button[aria-pressed=true]{box-shadow:inset 0 0 0 3px #fff}
.txt{width:100%;background:var(--bg);border:2px solid transparent;border-radius:14px;padding:12px 14px;font-weight:600}
.txt:focus{border-color:var(--sun);outline:none}
textarea.txt{min-height:220px;resize:vertical;line-height:1.5}
.err{color:#FF7A9C;font-weight:800;margin:0 0 14px;font-size:14px;min-height:1px}
.rules p{margin:0 0 14px}
.rules ol{padding-left:22px;margin:0 0 18px}
.rules li{margin-bottom:10px}
.overlay{position:fixed;inset:0;background:rgba(6,4,16,.72);display:none;z-index:50;align-items:flex-end;justify-content:center}
.overlay.on{display:flex}
.sheet{width:100%;max-width:520px;background:var(--bg-2);border-radius:28px 28px 0 0;padding:22px max(18px,calc(18px + var(--sr))) calc(22px + var(--sb)) max(18px,calc(18px + var(--sl)));animation:up .25s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.sheet h3{font-family:var(--display);font-size:20px;margin:0 0 14px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:14px;border-radius:18px;font-weight:800;font-size:17px;text-align:left;margin-bottom:8px;background:var(--bg)}
.opt small{display:block;color:var(--muted);font-weight:600;font-size:13px}
.opt[aria-pressed=true]{box-shadow:inset 0 0 0 3px var(--sun)}
.opt .flag{font-size:26px}
#modal{align-items:center;padding:24px}
#modal .box{background:var(--bg-2);border-radius:24px;padding:22px;max-width:380px;width:100%}
#modal p{margin:0 0 18px;font-size:18px;font-weight:800}
#modal .acts{display:flex;gap:10px}
#modal .btn{min-height:52px;font-size:17px;flex:1}
.toast{position:fixed;left:50%;bottom:calc(104px + var(--sb));transform:translateX(-50%);background:#fff;color:#1B1235;font-weight:800;padding:12px 18px;border-radius:18px;z-index:60;display:none;width:max-content;max-width:calc(100vw - 48px);text-align:center;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<!-- HOME -->
<section id="home" class="screen on">
  <div class="wrap">
    <div class="head">
      <div class="brand"><span class="mark" id="mark" aria-hidden="true"></span><b id="brandName">Топқир</b></div>
      <button class="pill" id="langBtn" aria-label="Language">🌐 <span id="langShort"></span></button>
      <button class="icon-btn" id="soundBtn" aria-label="Sound">🔊</button>
      <button class="icon-btn" id="rulesBtn" aria-label="?">?</button>
    </div>
    <div class="hero" id="hero">
      <h1 data-t="quickTitle"></h1>
      <p data-t="quickSub"></p>
      <button class="btn white" id="quickPlay">▶ <span data-t="quickBtn"></span></button>
      <div class="fan" id="fan" aria-hidden="true"><span></span><span></span><span></span></div>
    </div>
    <div class="stats" id="stats"></div>
    <div id="sections"></div>
  </div>
  <div class="dock"><div><button class="btn sun" id="toSetup"></button></div></div>
</section>

<!-- SETUP -->
<section id="setup" class="screen">
  <div class="wrap">
    <button class="back" data-go="home">‹ <span data-t="back"></span></button>
    <h2 class="title" data-t="setupTitle"></h2>
    <div class="card"><span class="lbl" data-t="time"></span>
      <div class="seg" id="timeSeg"><button data-v="30"></button><button data-v="60"></button><button data-v="90"></button><button data-v="120"></button></div>
    </div>
    <div class="card"><span class="lbl" data-t="mode"></span>
      <div class="seg" id="modeSeg"><button data-v="explain" data-t="mExplain"></button><button data-v="show" data-t="mShow"></button><button data-v="mix" data-t="mMix"></button></div>
      <p class="note" id="modeNote"></p>
    </div>
    <div class="card"><span class="lbl" data-t="teams"></span>
      <div id="teamList"></div>
      <button class="addteam" id="addTeam">+ <span data-t="addTeam"></span></button>
    </div>
    <div class="card"><span class="lbl" data-t="rounds"></span>
      <div class="stepper"><button id="rMinus" aria-label="−">−</button><span id="rVal">3</span><button id="rPlus" aria-label="+">+</button></div>
    </div>
    <p class="summary" id="setupSummary"></p>
  </div>
  <div class="dock"><div><button class="btn sun" id="startGame" data-t="startGame"></button></div></div>
</section>

<!-- TURN -->
<section id="turn" class="screen">
  <div class="center">
    <div class="blob" id="turnBlob"></div>
    <p class="kicker" id="turnKicker"></p>
    <div class="big-team" id="turnTeam"></div>
    <div class="chips" id="turnMeta"></div>
    <div class="howto">
      <div><i>📱</i><span data-t="how1"></span></div>
      <div><i>👇</i><span data-t="how2"></span></div>
      <div><i>👆</i><span data-t="how3"></span></div>
    </div>
    <button class="btn sun" id="ready" data-t="ready"></button>
    <button class="linkbtn" id="turnHome" data-t="endGame"></button>
  </div>
</section>

<!-- PLAY -->
<section id="play" class="screen">
  <div class="hud">
    <div class="ring" id="ring"><svg viewBox="0 0 64 64"><circle class="bgc" cx="32" cy="32" r="28"/><circle class="fg" id="ringFg" cx="32" cy="32" r="28"/></svg><b id="timer">60</b></div>
    <div class="glass" id="scoreLive">0</div>
    <button class="glass" id="quit" aria-label="×">×</button>
  </div>
  <div id="stage">
    <div class="glass" id="badge"></div>
    <h1 id="word"></h1>
    <div id="ans"></div>
    <div id="deckLbl"></div>
  </div>
  <div class="taps"><span data-t="tapSkip"></span><span data-t="tapOk"></span></div>
  <div id="flash"><div class="ic"></div><div class="big"></div><div class="small"></div></div>
  <div id="countdown"><div class="n">3</div><p data-t="putOnForehead"></p></div>
  <div id="rotate"><div class="ph">📱</div><h3 data-t="rotate"></h3><button class="btn ghost" id="rotateSkip" data-t="rotateSkip"></button></div>
</section>

<!-- RESULTS -->
<section id="results" class="screen">
  <div class="wrap">
    <div class="res-head"><div class="res-num" id="resRing"><b id="resNum">0</b></div><p id="resTxt"></p></div>
    <p class="hint" data-t="fixHint"></p>
    <div class="res-list" id="resList"></div>
  </div>
  <div class="dock"><div><button class="btn sun" id="resNext" data-t="continue"></button></div></div>
</section>

<!-- SCORE -->
<section id="score" class="screen">
  <div class="wrap">
    <h2 class="title" id="scoreTitle" style="text-align:center;margin-bottom:4px"></h2>
    <p class="hint" id="scoreSub"></p>
    <div class="board" id="board"></div>
  </div>
  <div class="dock"><div>
    <button class="btn ghost" id="scoreHome" data-t="home"></button>
    <button class="btn sun" id="scoreNext"></button>
  </div></div>
</section>

<!-- EDITOR -->
<section id="editor" class="screen">
  <div class="wrap">
    <button class="back" data-go="home">‹ <span data-t="back"></span></button>
    <h2 class="title" id="edTitle"></h2>
    <div class="card"><label class="lbl" for="edName" data-t="deckName"></label><input class="txt" id="edName" maxlength="40"></div>
    <div class="card"><span class="lbl" data-t="deckIcon"></span><div class="ed-emojis" id="edEmojis"></div></div>
    <div class="card"><label class="lbl" for="edWords" data-t="deckWords"></label><textarea class="txt" id="edWords"></textarea></div>
    <p class="err" id="edErr"></p>
  </div>
  <div class="dock"><div>
    <button class="btn danger" id="edDelete" data-t="delete"></button>
    <button class="btn sun" id="edSave" data-t="save"></button>
  </div></div>
</section>

<!-- RULES -->
<section id="rules" class="screen">
  <div class="wrap rules">
    <button class="back" data-go="home">‹ <span data-t="back"></span></button>
    <h2 class="title" data-t="rulesTitle"></h2>
    <div id="rulesBody"></div>
  </div>
</section>

<div class="overlay" id="langSheet"><div class="sheet" role="dialog" aria-modal="true">
  <h3 data-t="langTitle"></h3>
  <button class="opt" data-lang="uz"><span class="flag">🇺🇿</span><span>Ўзбекча<small>Кирилл</small></span></button>
  <button class="opt" data-lang="uzl"><span class="flag">🇺🇿</span><span>O‘zbekcha<small>Lotin</small></span></button>
  <button class="opt" data-lang="ru"><span class="flag">🇷🇺</span><span>Русский</span></button>
  <button class="opt" data-lang="en"><span class="flag">🇬🇧</span><span>English</span></button>
</div></div>
<div class="overlay" id="modal" role="dialog" aria-modal="true"><div class="box"><p></p><div class="acts"><button class="btn ghost" data-no></button><button class="btn sun" data-yes></button></div></div></div>
<div class="toast" id="toast"></div>
<canvas id="confetti" hidden></canvas>

<script src="words.js"></script>
<script src="app.js"></script>
</body>
</html>
